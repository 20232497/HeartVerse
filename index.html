<style>
/* Layout: 앱 셸 — 데스크톱은 왼쪽 레일 + 본문, 모바일은 하단 탭바. 대화방은 전체 높이 3단(헤더·로그·입력창), 관리 메뉴는 오른쪽 드로어. */
:root {

  --display:"Hahmlet","Nanum Myeongjo",serif; --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --chat-fs:15.5px; --r:14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f0d15; --surface:#18151f; --surface2:#211d2b; --line:#2e2939; --fg:#eeeaf6; --muted:#9a93ae;
  --narr:#b4acc7; --accent:#ff5b8e; --accent-ink:#1a0b12; --accent-soft:rgba(255,91,142,.14); --gold:#f0b54a; --ok:#53c48a; --err:#ff6b7a;
  --sys:#a99cff; --sys-soft:rgba(169,156,255,.10);
  --scrim:rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0f0d15; --surface:#18151f; --surface2:#211d2b; --line:#2e2939; --fg:#eeeaf6; --muted:#9a93ae;
  --narr:#b4acc7; --accent:#ff5b8e; --accent-ink:#1a0b12; --accent-soft:rgba(255,91,142,.14); --gold:#f0b54a; --ok:#53c48a; --err:#ff6b7a;
  --sys:#a99cff; --sys-soft:rgba(169,156,255,.10);
  --scrim:rgba(0,0,0,.6); color-scheme:dark; }

* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:14.5px; line-height:1.6; overflow:hidden; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.spacer { flex:1; }

/* ── 앱 셸 */
.app { display:grid; grid-template-columns:232px minmax(0,1fr); height:100%; }
.rail { border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; padding:18px 12px; gap:4px; overflow-y:auto; }
.logo { font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:.06em; padding:4px 10px 16px; display:flex; align-items:center; gap:8px; }
.logo i { font-style:normal; color:var(--accent); }
.nav { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:0; background:none; text-align:left; width:100%; color:var(--muted); font-weight:500; }
.nav:hover { background:var(--surface2); color:var(--fg); }
.nav.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav svg { width:19px; height:19px; flex:none; }
.rail h4 { margin:18px 12px 6px; font-size:11.5px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
.rail .recent { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:10px; border:0; background:none; width:100%; text-align:left; }

.rail .recent span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }

#view { height:100%; overflow-y:auto; overflow-x:hidden; position:relative; }
.tabbar { display:none; }
@media (max-width:899px) {

  #view { height:calc(100% - 60px - env(safe-area-inset-bottom,0px)); }
  .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; height:calc(60px + env(safe-area-inset-bottom,0px)); padding:0 max(6px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px, env(safe-area-inset-left,0px)); background:var(--surface); border-top:1px solid var(--line); z-index:20; }
  .tabbar button { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--muted); }
  .tabbar button.on { color:var(--accent); font-weight:600; }
  .tabbar svg { width:21px; height:21px; }
  body.in-chat .tabbar { display:none; }
  body.in-chat #view { height:100%; }
}

.page { max-width:1120px; margin:0 auto; padding-block:20px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.topbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.topbar .logo { padding:0; display:none; }
@media (max-width:899px) { .topbar { flex-wrap:wrap; } .topbar .logo { display:flex; font-size:18px; } .topbar .search { order:9; flex-basis:100%; max-width:none; } }
.search { flex:1; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 14px; height:40px; }
.search input { border:0; background:none; outline:none; flex:1; min-width:0; }

.wallet { display:flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }

.badge-pro { font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--gold); border:1px solid var(--gold); border-radius:5px; padding:0 5px; line-height:17px; }

.pill.gold { background:color-mix(in srgb, var(--gold) 16%, transparent); color:var(--gold); }
.pill.ok { background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }

h1.sec, h2.sec { font-family:var(--display); font-weight:700; font-size:19px; margin:30px 0 12px; display:flex; align-items:baseline; gap:10px; text-wrap:balance; flex-wrap:wrap; }

.chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); }
.chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
.note { color:var(--muted); font-size:12.5px; }
.empty { border:1px dashed var(--line); border-radius:var(--r); padding:22px; color:var(--muted); font-size:13.5px; text-align:center; }
.empty button { margin-top:10px; }

/* ── 버튼 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 16px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; white-space:nowrap; }
.btn:hover { border-color:var(--muted); }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

.btn.gold { background:var(--gold); color:#1d1404; border-color:var(--gold); }

.btn.block { width:100%; }
.btn.danger { color:var(--err); }

.icon-btn { width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; border:0; background:none; color:var(--muted); flex:none; }
.icon-btn:hover { background:var(--surface2); color:var(--fg); }
.icon-btn svg { width:20px; height:20px; }

/* ── 커버 아트 */
.cover { position:relative; overflow:hidden; isolation:isolate; color:#fff; container-type:inline-size;
  background:radial-gradient(110% 70% at 85% 5%, color-mix(in srgb, var(--c3) 55%, transparent), transparent 62%), linear-gradient(165deg, var(--c1) 10%, var(--c2) 120%); }

.cover .glyph { position:absolute; right:-.08em; bottom:-.2em; font-family:var(--display); font-weight:800; font-size:82cqw; line-height:1; color:color-mix(in srgb, var(--c3) 38%, transparent); z-index:1; user-select:none; }
.cover .vt { position:absolute; left:9%; top:9%; writing-mode:vertical-rl; font-family:var(--display); font-weight:700; font-size:max(11px, 7.2cqw); letter-spacing:.14em; z-index:3; text-shadow:0 1px 8px rgba(0,0,0,.4); max-height:82%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.cover.has-img .glyph, .cover.has-img .vt { display:none; }
.m-rain::before { background:repeating-linear-gradient(103deg, rgba(255,255,255,.13) 0 1px, transparent 1px 11px); -webkit-mask:linear-gradient(to bottom, #000, transparent 85%); mask:linear-gradient(to bottom, #000, transparent 85%); }
.m-city::before { background:repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,226,170,.35) 7% 8%, transparent 8% 11%), linear-gradient(to top, rgba(0,0,0,.5), transparent);
  -webkit-mask:linear-gradient(to top, #000 0 38%, transparent 62%); mask:linear-gradient(to top, #000 0 38%, transparent 62%); }
.m-stars::before { background:
  radial-gradient(1.4px 1.4px at 12% 18%, #fff 50%, transparent), radial-gradient(1px 1px at 31% 42%, #fff 50%, transparent),
  radial-gradient(1.6px 1.6px at 58% 12%, #fff 50%, transparent), radial-gradient(1px 1px at 77% 33%, #fff 50%, transparent),
  radial-gradient(1.2px 1.2px at 88% 9%, #fff 50%, transparent), radial-gradient(1px 1px at 44% 26%, #fff 50%, transparent),
  radial-gradient(1.3px 1.3px at 20% 58%, #fff 50%, transparent), radial-gradient(1px 1px at 66% 52%, #fff 50%, transparent),
  radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.08), transparent); }

.m-petals::before { background:
  radial-gradient(9px 5px at 18% 22%, color-mix(in srgb, var(--c3) 85%, transparent) 60%, transparent), radial-gradient(7px 4px at 72% 16%, color-mix(in srgb, var(--c3) 75%, transparent) 60%, transparent),
  radial-gradient(8px 5px at 40% 48%, color-mix(in srgb, var(--c3) 70%, transparent) 60%, transparent), radial-gradient(6px 4px at 84% 54%, color-mix(in srgb, var(--c3) 80%, transparent) 60%, transparent),
  radial-gradient(7px 4px at 26% 70%, color-mix(in srgb, var(--c3) 65%, transparent) 60%, transparent); }
.m-ash::before { background:radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.6px) 0 0/14px 14px, linear-gradient(to bottom, rgba(0,0,0,.25), transparent 50%); -webkit-mask:linear-gradient(to bottom, #000, transparent); mask:linear-gradient(to bottom, #000, transparent); }
.m-curtain::before { background:repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 6px, rgba(255,255,255,.06) 6px 9px, transparent 9px 18px), radial-gradient(70% 45% at 50% 0%, color-mix(in srgb, var(--c3) 45%, transparent), transparent);
  -webkit-mask:linear-gradient(to right, #000 0 22%, transparent 34% 66%, #000 78%); mask:linear-gradient(to right, #000 0 22%, transparent 34% 66%, #000 78%); }

/* ── 홈 */
.hero { display:grid; grid-auto-flow:column; grid-auto-columns:min(560px, 86%); gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:thin; }
.hero-card { scroll-snap-align:start; border-radius:18px; overflow:hidden; border:0; padding:0; text-align:left; display:grid; grid-template-columns:42% 1fr; background:var(--surface); min-height:230px; box-shadow:0 1px 0 var(--line); }
.hero-card .cover { height:100%; min-height:230px; }
.hero-card .body { padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
.hero-card .k { font-size:11.5px; color:var(--accent); font-weight:600; letter-spacing:.06em; }
.hero-card h3 { margin:0; font-family:var(--display); font-size:22px; line-height:1.25; text-wrap:balance; }
.hero-card p { margin:0; color:var(--muted); font-size:13.5px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.hero-card .who { margin-top:auto; font-size:13px; font-weight:600; }
@media (max-width:520px) { .hero-card { grid-template-columns:1fr; } .hero-card .cover { min-height:170px; } }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:16px 14px; }
@media (max-width:420px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px 10px; } }
.card { border:0; padding:0; background:none; text-align:left; display:flex; flex-direction:column; gap:7px; min-width:0; }
.card .cover { aspect-ratio:3/4; border-radius:14px; width:100%; max-width:100%; transition:transform .2s; }
.card:hover .cover { transform:translateY(-3px); }
.card .t { font-weight:700; font-size:14.5px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .d { color:var(--muted); font-size:12.5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.9em; }
.card .meta { display:flex; gap:6px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
.cat { position:absolute; top:8px; right:8px; z-index:3; font-size:10.5px; font-weight:600; background:rgba(0,0,0,.42); backdrop-filter:blur(6px); padding:2px 8px; border-radius:999px; color:#fff; }
.cont { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px; }
.cont > button { display:flex; gap:12px; align-items:center; text-align:left; padding:10px; border-radius:14px; border:1px solid var(--line); background:var(--surface); min-width:0; }
.cont .cover { width:52px; height:52px; border-radius:12px; flex:none; }
.cont .x { min-width:0; flex:1; }
.cont .x b { display:block; font-size:14px; }
.cont .x span { display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── 캐릭터 상세 */
.detail { display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:28px; align-items:start; }
@media (max-width:780px) { .detail { grid-template-columns:1fr; gap:18px; } }
.detail > div > .cover { aspect-ratio:3/4; border-radius:20px; width:100%; max-width:100%; }
@media (max-width:780px) { .detail > div > .cover { aspect-ratio:4/3; } }
.detail h1 { font-family:var(--display); font-size:30px; line-height:1.2; margin:4px 0 6px; text-wrap:balance; }
.detail .lead { font-size:15.5px; margin:0 0 12px; }
.detail .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.detail .tags span { font-size:12.5px; background:var(--surface2); border-radius:7px; padding:2px 9px; color:var(--muted); }
.box { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }

.box p { margin:0; white-space:pre-wrap; }
.openings { display:grid; gap:8px; }

.cast .portrait { aspect-ratio:1; border-radius:14px; overflow:hidden; }

.cta-row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }

.field { display:grid; gap:5px; margin-top:12px; }
.field label, .lbl { font-size:12.5px; color:var(--muted); font-weight:600; }
.field input, .field textarea, .field select, .inp { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); outline:none; }
.field input:focus, .field textarea:focus, .field select:focus, .inp:focus { border-color:var(--accent); }

/* ── 장면 이미지 */
.scene-img { margin:4px 0 8px; max-width:min(380px, 100%); border-radius:16px; overflow:hidden; background:var(--surface2); position:relative; }

  background:radial-gradient(80% 60% at 70% 20%, color-mix(in srgb, var(--tint) 55%, transparent), transparent 70%), radial-gradient(60% 50% at 20% 90%, color-mix(in srgb, var(--c3) 40%, transparent), transparent 70%), linear-gradient(160deg, var(--c1), var(--c2)); }
.artcard::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 10px); z-index:0; }
.artcard .ac-g { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font-family:var(--display); font-weight:800; font-size:62cqw; line-height:1; color:rgba(255,255,255,.88); text-shadow:0 8px 40px color-mix(in srgb, var(--tint) 70%, transparent); z-index:1; }
.artcard .ac-s { position:absolute; top:12px; left:12px; font-family:var(--display); font-weight:700; font-size:max(13px, 6.5cqw); letter-spacing:.08em; z-index:2; color:color-mix(in srgb, var(--tint) 80%, #fff); }

.thumb-art .artcard { aspect-ratio:1; }

.thumb-art .artcard .ac-s, .thumb-art .artcard .ac-n { display:none; }
.lightbox { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; padding:max(16px, env(safe-area-inset-top,0px)) 16px; cursor:zoom-out; animation:fade .18s; }
.lightbox img { max-width:100%; max-height:100%; border-radius:12px; }

/* ── 대화방 */
.chat { display:flex; flex-direction:column; height:100%; position:relative; }
.chat-bg { position:absolute; inset:0; z-index:0; opacity:.16; filter:blur(28px) saturate(1.2); pointer-events:none; overflow:hidden; }

    <div class="field"><label for="dir">다시 쓸 방향 (선택)</label><textarea id="dir" maxlength="300" placeholder="예: 서윤이 좀 더 솔직하게 반응하도록 / 전투를 더 길게"></textarea></div>

  $("#dir", sh).focus();
  $("#go", sh).onclick = () => { const d = $("#dir", sh).value.trim(); closeOverlays(); regen(i, d); };
}
async function regen(i, direction = "") {
  if (gen) return;
  const q = await ensurePay(room); if (!q) return;
  room.msgs = room.msgs.slice(0, i + 1);
  generate(room.msgs[i], q, direction);
}
/* target 없으면 새 AI 메시지, 있으면 그 메시지에 새 버전(alt) 추가 */
async function generate(target, q, direction = "", isEdit = false) {
  const r = room, c = r.char, model = r.set.model;
  let msg = target, altIdx;
  if (!msg) {
    const prev = lastAi(r);
    const before = prev ? (prev.alts[prev.idx].status || prev.statusBefore) : r.status;
    msg = { id: uid("m"), role: "ai", idx: 0, alts: [{ text: "" }], statusBefore: before };
    r.msgs.push(msg); altIdx = 0;
  } else { msg.alts.push({ text: "" }); altIdx = msg.alts.length - 1; msg.idx = altIdx; }
  const input = buildInput(r, r.msgs.indexOf(msg), msg.statusBefore, direction);
  const label = `${c.title} · ${MODELS[model].name}${target ? " 다시 쓰기" : ""}`;
  charge(q, label);
  const ctl = new AbortController();
  gen = { ctl, msgId: msg.id };
  renderLog(true); updateComposer();
  const show = (t) => {
    const body = t.split(MARK)[0].replace(/\n?=+[A-Z]*=*\s*$/, "").replace(/\[\[[^\]]*$/, "");
    msg.alts[altIdx].text = body.trim();
    if (room !== r) return;
    const el = $("#liveBubble");
    if (el) { el.innerHTML = fmt(msg.alts[altIdx].text, c, r.persona); IMG.hydrate(el); const log = $("#log"); if (log && log.scrollHeight - log.scrollTop - log.clientHeight < 240) log.scrollTop = log.scrollHeight; }
    else renderLog(true);
  };
  try {
    const text = await llm(input, { tier: MODELS[model].tier, signal: ctl.signal, onText: ({ text }) => show(text), maxTokens: { short: 1200, mid: 2000, long: 3200 }[r.set.len] });
    show(text);
    const parsed = parseState(text, c, msg.statusBefore);
    Object.assign(msg.alts[altIdx], parsed, { text: msg.alts[altIdx].text || "(빈 응답)", cost: qShort(q) });
    r.status = parsed.status;
    if (!target && !isEdit) { r.turn = (r.turn || 0) + 1; r.sinceMem = (r.sinceMem || 0) + 1; }
  } catch (e) {
    const keep = e && e.text ? e.text.split(MARK)[0].trim() : "";
    if (keep && e.code === "cancelled") Object.assign(msg.alts[altIdx], { text: keep, status: msg.statusBefore, cost: qShort(q) });
    else {
      msg.alts.splice(altIdx, 1);
      if (!msg.alts.length) r.msgs.splice(r.msgs.indexOf(msg), 1); else msg.idx = msg.alts.length - 1;
      refund(q, label);
      const copy = errCopy(e); if (copy) r.lastErr = copy;
    }
  } finally {
    gen = null;
    saveRoom(r);
    if (room === r && $("#logInner")) { renderLog(true); updateComposer(); updateMeter(); $("#inp")?.focus({ preventScroll: true }); }
    maybeSummarize(r);
  }
}
function stopGen() { if (gen) gen.ctl.abort(); }
function parseState(text, c, before) {
  const i = text.indexOf(MARK);
  const out = { status: { ...(before || {}) }, suggestions: [] };
  if (i < 0) return out;
  const v = looseJSON(text.slice(i + MARK.length));
  if (!v || typeof v !== "object") return out;
  if (v.status && typeof v.status === "object") {
    for (const f of c.fields) if (v.status[f] !== undefined && v.status[f] !== null) out.status[f] = typeof v.status[f] === "string" ? v.status[f].slice(0, 200) : v.status[f];
    if (typeof before?.[c.gauge] === "number") {
      const g = Number(v.status[c.gauge]), prev = before[c.gauge];
      out.status[c.gauge] = Number.isFinite(g) ? clamp(Math.round(clamp(g, prev - 10, prev + 8)), 0, 100) : prev;
    }
  }
  if (Array.isArray(v.suggestions)) out.suggestions = v.suggestions.filter((s) => typeof s === "string").map((s) => s.slice(0, 80)).slice(0, 3);
  return out;
}

/* AI 추천 답변: 평소엔 숨김, 버튼을 누르면 표시 (없으면 무료로 생성) */
function hideSug() { const p = $("#sugPanel"); if (p) p.hidden = true; const b = $("#sugBtn"); if (b) { b.classList.remove("on"); b.setAttribute("aria-expanded", "false"); } }
async function toggleSug() {

    try {

- 서로 다른 방향(다정·도발·신중 등), 각 40자 이내, ${r.persona.name}의 1인칭 시점. 행동은 *별표*, 대사는 "큰따옴표".
- JSON {"suggestions":["…","…","…"]} 하나로만 답하라.

${recent}` }], { tier: "quick", json: true });
      const list = Array.isArray(v?.suggestions) ? v.suggestions.filter((s) => typeof s === "string").map((s) => s.slice(0, 80)).slice(0, 3) : [];
      if (!list.length) throw { code: "invalid_json" };

/* ---------------------------------------------------------------- 장기기억: N턴마다 자동 요약, 한도 초과 시 압축 후 히스토리 보관 */
let summarizing = false;
function memCfg() { const c = S.settings.memCfg; return { ...c, limit: Math.min(c.limit, plan().memoMax) }; }
function pushHist(r, text, label) {
  if (!text || !text.trim()) return;
  r.memHist = [{ at: Date.now(), label, text }, ...(r.memHist || [])].slice(0, plan().hist);
}
async function maybeSummarize(r, manual = false) {
  const cfg = memCfg();
  if (summarizing) return;
  if (!manual && (!cfg.auto || (r.sinceMem || 0) < cfg.every)) return;
  const n = manual ? Math.max(1, r.sinceMem || cfg.every) : cfg.every;
  const msgs = r.msgs.filter((m) => !m.sys && curText(m)).slice(-(n * 2));
  if (!msgs.length) return;
  summarizing = true; flagMemo(true, "장기기억을 정리하는 중…");
  const to = r.turn || 0, from = Math.max(1, to - n + 1);
  const guide = cfg.guide === "custom" && cfg.custom.trim() ? cfg.custom.trim() : "인물 관계의 변화, 약속, 밝혀진 과거·비밀, 얻은 물건·능력, 중요한 사건과 수치(레벨·코인 등), 미해결 떡밥을 빠짐없이 남긴다. 사건 순서가 드러나게 쓴다.";
  try {
    const excerpt = msgs.map((m) => (m.role === "ai" ? speakerName(r) : r.persona.name) + ": " + curText(m).replace(/\[\[img:[^\]]*\]\]/g, "").replace(/\s+/g, " ").slice(0, 900)).join("\n");
    const v = await llm([{ role: "user", content: `롤플레이 「${r.char.title}」의 최근 ${n}턴을 장기기억용으로 요약하라. 유저 캐릭터 이름은 ${r.persona.name}.
요약 지침: ${guide}
JSON {"title":"이 구간의 짧은 제목(15자 이내)","summary":"3~6문장 요약"} 하나로만 답하라.

[직전까지의 기억 끝부분]
${(r.memory || "(없음)").slice(-800)}

[이번 구간 대화]
${excerpt}` }], { tier: "quick", json: true });
    if (!v || typeof v.summary !== "string") throw 0;
    r.memory = ((r.memory || "").trim() + `\n\n[${from}-${to}턴] ${String(v.title || "").slice(0, 30)}\n${v.summary.trim()}`).trim();
    r.sinceMem = 0;
    if (r.memory.length > cfg.limit) {
      pushHist(r, r.memory, "압축 전 기억");
      flagMemo(true, "기억이 길어져 압축하는 중…");
      const c2 = await llm([{ role: "user", content: `다음 장기기억 노트를 ${Math.round(cfg.limit * 0.6)}자 이내로 압축하라. [a-b턴] 구간 표시는 합쳐도 되지만 사건 순서는 유지하고, 관계·약속·비밀·능력·수치·떡밥을 우선 남겨라. JSON {"memory":"..."} 하나로만 답하라.\n\n${r.memory}` }], { tier: "quick", json: true });
      if (c2 && typeof c2.memory === "string" && c2.memory.trim()) r.memory = c2.memory.trim().slice(0, cfg.limit);
      else r.memory = r.memory.slice(-cfg.limit);
    }
    saveRoom(r);
    if (manual) toast("장기기억을 업데이트했어요");
  } catch (e) { if (manual) toast("요약하지 못했어요. 잠시 뒤 다시 시도해 주세요."); }
  finally { summarizing = false; flagMemo(false); }
}

function galleryItems(r) {

async function exportRoom(r) {
  const data = exportText(r), filename = `HEARTVERSE_${r.char.title.replace(/[^\w가-힣]+/g, "_")}_${new Date().toISOString().slice(0, 10)}.txt`;

/* ---------------------------------------------------------------- 이미지 슬롯 관리 */
function openImageSlots(c, code) {
  c = normalizeChar(c);
  const mine = S.mine.find((m) => m.id === c.id);
  let cur = code && c.cast.some((x) => x.code === code) ? code : c.cast[0].code;
  const store = () => mine ? (mine.images ||= {}) : (S.imgpacks[c.id] ||= {});
  const persist = () => { if (mine) { KV.set("mine", S.mine); if (mine.publish) publishCommunity(); } else KV.set("imgpacks", S.imgpacks); };
  const put = async (file, sit, code = cur) => { const ref = await IMG.put(file); const m = store()[code] || {}; IMG.drop(m[sit]); m[sit] = ref; store()[code] = m; };
  const prompt = (cast, i) => `웹툰풍 캐릭터 일러스트, ${cast.look || cast.name}, ${SIT[i]} 표정과 자세, 상반신, 세로 4:5 구도, 「${c.title}」 분위기의 배경`;
  const refsFor = (code, i) => { const s = imagesOf(c)[code] || {}; return [0, 1].filter((k) => k !== i && validRef(s[k])).slice(0, 1).map((k) => s[k]); };
  let live = null, bulk = null;
  const paint = () => {
    const cast = c.cast.find((x) => x.code === cur), slots = imagesOf(c)[cur] || {};
    const ov = sheet(`<div class="sheet-head"><h2>이미지 슬롯</h2><button class="icon-btn" data-x aria-label="닫기">${ICON.close}</button></div>
      <p class="sub">대화 중 <b>[[img:${esc(cur)}:번호]]</b>가 나오면 그 칸의 이미지가 보여요. 빈 칸은 같은 인물의 기본·프로필 이미지, 그것도 없으면 일러스트 카드로 대신해요.${mine ? "" : " 이 작품의 이미지는 내 계정에만 저장돼요."}</p>
      <div class="casttabs chips">${c.cast.map((x) => `<button class="chip ${x.code === cur ? "on" : ""}" data-cc="${esc(x.code)}">${esc(x.name)} <small>${esc(x.code)}</small></button>`).join("")}</div>
      <div class="cta-row" style="margin:0 0 10px"><button class="btn sm pri" id="bulk">여러 장 한 번에 올리기</button><button class="btn sm" id="aiAll">${bulk ? "AI 채우기 멈추기" : "빈 칸 AI로 채우기"}</button><button class="btn sm" id="prompt">이미지 프롬프트 복사</button><span class="note">파일 이름을 '2.png'나 '${esc(cur)}_2.png'처럼 번호로 지으면 그 칸에 자동으로 들어가요.</span></div>
      <div class="slot-grid">${SIT.map((s, i) => { const ref = validRef(slots[i]) ? slots[i] : null; return `<div class="slot"><div class="pic${bulk && bulk.code === cur && bulk.at === i ? " busy" : ""}">${ref ? IMG.tag(ref) : artHTML(c, cast, i)}</div><span class="lb">${i} ${s}${i === 0 ? " <small>첫 등장</small>" : ""}</span><div class="bs"><button data-up="${i}">${ref ? "바꾸기" : "올리기"}</button><button data-ai="${i}">AI</button>${ref ? `<button data-rm="${i}">삭제</button>` : ""}</div></div>`; }).join("")}</div>
      <input type="file" id="one" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="many" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <p class="note" style="margin-top:12px">${IMG.assets ? "이미지는 이 아티팩트의 저장소에 올라가요." : "이미지는 압축해서 내 저장 공간에 보관해요."} 외부 이미지 주소는 보안 정책상 불러올 수 없어서 파일로 올려 주세요. AI 버튼은 설정의 Gemini API 키로 이미지를 만들어요. 프로필·기본 이미지가 있으면 그걸 참고해서 같은 인물로 그려요.</p>`, "wide");
    live = ov; IMG.hydrate(ov);
    $$("[data-cc]", ov).forEach((b) => b.onclick = () => { cur = b.dataset.cc; paint(); });
    let target = 0;
    $$("[data-up]", ov).forEach((b) => b.onclick = () => { target = +b.dataset.up; $("#one", ov).click(); });
    $$("[data-rm]", ov).forEach((b) => b.onclick = () => { const m = store()[cur] || {}; IMG.drop(m[b.dataset.rm]); delete m[b.dataset.rm]; store()[cur] = m; persist(); paint(); });
    $$("[data-ai]", ov).forEach((b) => b.onclick = () => {
      const i = +b.dataset.ai, code = cur;
      genImageSheet({ title: `${cast.name} · ${i} ${SIT[i]}`, prompt: prompt(cast, i), aspect: "4:5", refs: refsFor(code, i),
        onUse: async (blob) => { await put(blob, i, code); persist(); if (live?.isConnected) paint(); toast("이미지를 등록했어요"); } });
    });
    $("#aiAll", ov).onclick = async () => {
      if (bulk) { bulk.stop = true; return; }
      if (!S.settings.geminiKey) { toast(genErr({ code: "no_key" })); return; }
      const code = cur, ca = cast, todo = SIT.map((_, i) => i).filter((i) => !validRef((imagesOf(c)[code] || {})[i]));
      if (!todo.length) { toast("빈 칸이 없어요"); return; }
      bulk = { code, at: -1, stop: false }; let ok = 0, err = null;
      for (const i of todo) {
        if (bulk.stop) break;
        bulk.at = i; if (live?.isConnected) paint(); toast(`AI로 채우는 중… ${ok + 1}/${todo.length}`);
        try { await put(await geminiImage(prompt(ca, i), { aspect: "4:5", refs: refsFor(code, i) }), i, code); persist(); ok++; }
        catch (e) { err = e; if (["no_key", "bad_key", "bad_model", "network", "rate_limited"].includes(e?.code)) break; }
      }
      const stopped = bulk.stop; bulk = null; if (live?.isConnected) paint();
      toast(`${ok}장 만들었어요${stopped ? " (멈춤)" : err ? ` · ${genErr(err)}` : ""}`);
    };
    $("#one", ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; toast("올리는 중…"); try { await put(f, target); persist(); paint(); toast("이미지를 등록했어요"); } catch { toast("이미지를 읽지 못했어요. PNG·JPG로 다시 올려 주세요."); } };
    $("#bulk", ov).onclick = () => $("#many", ov).click();
    $("#many", ov).onchange = async (e) => {
      const files = [...e.target.files]; let ok = 0, skip = 0; toast(files.length + "장을 올리는 중…");
      for (const f of files) {
        const base = f.name.replace(/\.[^.]+$/, "").toLowerCase(), m = base.match(/(?:^|[_\-\s])([a-z]+\d*)?[_\-\s]?(\d{1,2})$/) || base.match(/^(\d{1,2})$/);
        const sit = m ? +(m[2] ?? m[1]) : NaN;
        if (!Number.isInteger(sit) || sit < 0 || sit >= SIT.length) { skip++; continue; }
        try { await put(f, sit); ok++; } catch { skip++; }
      }
      persist(); paint(); toast(`${ok}장 등록${skip ? `, ${skip}장은 번호를 알 수 없어 건너뛰었어요` : ""}`);
    };
    $("#prompt", ov).onclick = () => copyText(SIT.map((s, i) => `${i} ${s}: ${prompt(cast, i)}`).join("\n"), "15장 분량의 프롬프트를 복사했어요");
  };
  paint();
}

function parseCast(text, name) {
  const out = [], used = new Set();
  String(text).split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 12).forEach((l) => {
    const [code, nm, look] = l.split("|").map((x) => (x || "").trim());
    const cd = (code || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8);
    if (!cd || !nm || used.has(cd)) return; used.add(cd); out.push({ code: cd, name: nm.slice(0, 16), look: (look || "").slice(0, 200) });
  });
  return out.length ? out : [{ code: "c", name: name || "캐릭터", look: "" }];
}

  d.world_mode = !!$("#f-wm")?.checked;

  d.gauge = val("#f-gauge") || d.fields[0] || "호감도";
  d.cast = parseCast(val("#f-cast"), d.name);
  d.openings = d.openings.map((o, i) => ({ ...o, title: val("#o-t" + i), text: $("#o-x" + i)?.value.trim() ?? o.text, directive: val("#o-d" + i) }));
  d.publish = !!$("#f-pub")?.checked;
}

async function aiDraft(id) {

  collect(); b.disabled = true; m.className = "msgline"; m.textContent = "캐릭터를 설계하는 중… (보통 20~60초)";
  const prompt = `한국어 캐릭터 롤플레이 플랫폼에 올릴 오리지널 캐릭터를 설계하라. 컨셉: ${concept}
조건: 모든 인물은 성인(20세 이상). 실존 인물·기존 작품 캐릭터를 쓰지 않는다. 유저가 바로 몰입할 수 있는 구체적 갈등과 떡밥을 넣는다.
JSON 하나로만 답하라:
{"name":"캐릭터 이름","title":"작품명(12자 이내)","oneLiner":"카드용 한 줄 소개(45자 이내, 유저를 '당신'으로)","cat":"${CATS.join("|")} 중 하나","tags":["태그 4개"],"glyph":"작품을 상징하는 한자 한 글자","pal":0~7 정수(0 밤비 남색,1 장미,2 별밤,3 새벽 청록,4 단풍,5 잿빛,6 네온 보라,7 숲),"motif":"rain|city|stars|glow|petals|ash|curtain","desc":"상세 소개 2~3문장","persona":"이름(나이, 성별). 직업·신분. 성격(장점과 결점). 버릇. 외모. 유저와의 관계 — 5~7문장","look":"외모 한 줄(이미지 프롬프트용)","world":"세계관·장소·주변 인물·규칙 3~5문장","speech":"말투 설명 한 줄 + 대표 대사 2개(각 줄에 큰따옴표)","secret":"숨겨진 설정 한 문장","fields":["상태창 항목 3~5개, 관계 게이지 항목과 '속마음' 포함"],"gauge":"관계 게이지 항목 이름","openings":[{"title":"상황 제목","text":"첫 메시지 300~500자. 첫 문단 뒤에 [[img:c:0]] 한 줄. *서술* 과 \\"대사\\" 를 줄바꿈으로 섞고, 유저가 반응할 여지를 남기며 끝낸다. 유저의 행동은 쓰지 않는다."},{"title":"다른 상황","text":"..."}]}`;
  try {
    const v = await llm([{ role: "user", content: prompt }], { tier: "default", json: true, maxTokens: 3000 });
    if (!v || typeof v !== "object" || !v.name) throw { code: "invalid_json" };
    const d = draft, s = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
    Object.assign(d, {
      name: s(v.name, 16), title: s(v.title, 24), oneLiner: s(v.oneLiner, 70), cat: CATS.includes(v.cat) ? v.cat : d.cat,
      tags: Array.isArray(v.tags) ? v.tags.map((t) => s(t, 12).replace(/^#/, "")).filter(Boolean).slice(0, 5) : d.tags,
      glyph: s(v.glyph, 1), pal: Number.isInteger(v.pal) && PALETTES[v.pal] ? v.pal : d.pal, motif: MOTIFS[v.motif] ? v.motif : d.motif,
      desc: s(v.desc, 600), persona: s(v.persona, 3000), world: s(v.world, 2500), speech: s(v.speech, 800), secret: s(v.secret, 200),
      fields: Array.isArray(v.fields) && v.fields.length ? v.fields.map((f) => s(f, 12)).filter(Boolean).slice(0, 8) : d.fields,
      gauge: s(v.gauge, 12) || d.gauge, cast: [{ code: "c", name: s(v.name, 16), look: s(v.look, 200) }],
      openings: Array.isArray(v.openings) && v.openings.length ? v.openings.slice(0, 3).map((o) => ({ title: s(o.title, 30), text: s(o.text, 3000), directive: "", status: {} })) : d.openings
    });
    viewStudio(id); const mm = $("#aiMsg"); mm.className = "msgline ok"; mm.textContent = "초안을 채웠어요. 마음에 들게 고친 뒤 만들기를 누르세요.";
  } catch (e) {
    b.disabled = false; m.className = "msgline err"; m.textContent = e.code === "invalid_json" ? "초안 형식이 깨졌어요. 한 번 더 눌러 주세요." : errCopy(e) || "취소했어요.";
  }
}

/* 커뮤니티: pub/<내 id> 문서 하나에 내 공개 캐릭터를 모아 둔다 (모두 읽기, 본인만 쓰기) */
function pubImages(images) {
  const out = {};
  for (const [code, m] of Object.entries(images || {})) for (const [k, ref] of Object.entries(m || {})) if (typeof ref === "string" && ref.startsWith("/_blob/") && validRef(ref)) (out[code] ||= {})[k] = ref;
  return out;
}
async function publishCommunity() {
  if (!DB || !KV.uid) return;
  const pubs = S.mine.filter((m) => m.publish).map((m) => ({ ...m, img: typeof m.img === "string" && m.img.startsWith("kv:") ? "" : m.img, images: pubImages(m.images), creator: S.profile.nick || "익명 크리에이터" }));
  try { if (pubs.length) await DB.doc("pub/" + KV.uid).set({ chars: pubs, at: Date.now() }); else await DB.doc("pub/" + KV.uid).delete(); }
  catch { if (pubs.length) toast("커뮤니티 공개는 이 페이지에 참여 권한이 있는 사람만 할 수 있어요. 캐릭터는 내 보관함에 저장됐어요."); }
}
function cleanChar(c) {
  if (!c || typeof c !== "object") return null;
  const s = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
  if (!/^u[a-z0-9]+$/.test(s(c.id, 40)) || !c.name || !Array.isArray(c.openings) || !c.openings.length) return null;
  const fields = Array.isArray(c.fields) ? c.fields.map((f) => s(f, 12)).filter(Boolean).slice(0, 16) : ["호감도"];
  const gauge = s(c.gauge, 12) || fields[0];
  const cast = Array.isArray(c.cast) ? c.cast.slice(0, 12).map((x) => ({ code: s(x?.code, 8).toLowerCase().replace(/[^a-z0-9]/g, ""), name: s(x?.name, 16), look: s(x?.look, 200) })).filter((x) => x.code && x.name) : [];
  return { id: c.id, name: s(c.name, 16), title: s(c.title, 24), oneLiner: s(c.oneLiner, 70), cat: CATS.includes(c.cat) ? c.cat : "일상",
    tags: Array.isArray(c.tags) ? c.tags.map((t) => s(t, 12)).slice(0, 5) : [], glyph: s(c.glyph, 1), pal: PALETTES[c.pal] ? c.pal : 0, motif: MOTIFS[c.motif] ? c.motif : "glow",
    img: validRef(c.img) && !String(c.img).startsWith("kv:") ? c.img : "", images: pubImages(c.images), world_mode: !!c.world_mode,
    desc: s(c.desc, 600), persona: s(c.persona, 3000), world: s(c.world, 2500), speech: s(c.speech, 800), secret: s(c.secret, 200),
    fields: fields.includes(gauge) ? fields : [gauge, ...fields], gauge, cast: cast.length ? cast : [{ code: "c", name: s(c.name, 16), look: "" }], creator: s(c.creator, 20) || "익명 크리에이터",
    openings: c.openings.slice(0, 6).map((o) => ({ title: s(o?.title, 30), text: s(o?.text, 3000), directive: s(o?.directive, 300), status: (o && typeof o.status === "object" && o.status) ? o.status : {} })).filter((o) => o.text) };
}
function watchCommunity() {
  if (!DB) return;
  DB.collection("pub").limit(200).onSnapshot((snap) => {
    const list = [];
    snap.docs.forEach((doc) => { const arr = doc.data()?.chars; if (Array.isArray(arr)) arr.slice(0, 20).forEach((c) => { const cc = cleanChar(c); if (cc && cc.openings.length) list.push(cc); }); });
    S.community = list;
    const h = location.hash.slice(1) || "home"; if (h === "home") viewHome();
  }, () => {});
}

    ${S.wallet.history.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>일시</th><th>상품</th><th class="num">금액</th></tr></thead><tbody>
      ${S.wallet.history.slice(0, 20).map((h) => `<tr><td>${new Date(h.at).toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" })}</td><td>${esc(h.name)}</td><td class="num">${won(h.price)} <span class="note">(데모)</span></td></tr>`).join("")}</tbody></table></div>`
      : `<p class="note">아직 결제 내역이 없어요.</p>`}
  </div>`;
  bindGo(v);
  const bp = $("#buyPlus"); if (bp) bp.onclick = () => checkout(PLUS);
  $$("[data-pack]", v).forEach((b) => b.onclick = () => buyPack(b.dataset.pack));
}
function checkout(item, after) {
  const vat = Math.round(item.price / 11);
  const ov = sheet(`<h2>결제하기</h2><p class="sub">${esc(item.name)}${item.id === "plus" ? ` · 하트 ${PLUS_MONTHLY}개 포함` : ""}</p>
    <div class="sumrow"><span>상품 금액</span><span>${won(item.price - vat)}</span></div>
    <div class="sumrow"><span>부가세</span><span>${won(vat)}</span></div>
    <div class="sumrow total"><span>최종 결제 금액</span><span>${won(item.price)}</span></div>
    <div class="payopt" role="radiogroup" aria-label="결제 수단">
      <label><input type="radio" name="pm" checked> 신용·체크카드</label><label><input type="radio" name="pm"> 간편결제</label><label><input type="radio" name="pm"> 휴대폰 결제</label>
    </div>
    <p class="demo-note">데모 결제예요. 결제 정보를 받지 않고, 실제로 청구되지 않아요.</p>
    <div class="cta-row"><span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="pay">${won(item.price)} 결제하기</button></div>`);
  $("#pay", ov).onclick = () => {
    const b = $("#pay", ov); b.disabled = true; b.textContent = "결제 승인 중…";
    setTimeout(() => {
      if (item.id === "plus") { const base = isPro() ? S.wallet.pro.until : Date.now(); S.wallet.pro = { until: base + 30 * 86400000 }; S.wallet.hearts += PLUS_MONTHLY; ledger(PLUS_MONTHLY, "PLUS 월간 하트"); }
      else { S.wallet.hearts += item.hearts; ledger(item.hearts, item.name + " 충전"); }
      S.wallet.history.unshift({ at: Date.now(), name: item.name, price: item.price }); S.wallet.history = S.wallet.history.slice(0, 50);
      saveWallet();
      $(".sheet", ov).innerHTML = `<div class="ok-mark">♥</div><h2 style="text-align:center">결제 완료</h2>
        <p class="sub" style="text-align:center">${item.id === "plus" ? `HEARTVERSE+가 시작됐어요. 라이트 무제한, 하트 ${PLUS_MONTHLY}개가 지급됐어요.` : `하트 ${num(item.hearts)}개가 지급됐어요. 지금 ♥ ${num(S.wallet.hearts)}`}</p>
        <button class="btn pri block" id="done">${after ? "대화로 돌아가기" : "확인"}</button>`;
      $("#done", ov).onclick = () => { ov.remove(); if (after) after(); else route(); };
    }, 1000);
  };
}

      <button class="btn sm" id="nickSave" style="margin-top:10px">저장</button></div>
    <h2 class="sec">설정</h2>
    <div class="box">
      <div class="two">
        <div class="field" style="margin-top:0"><label for="fs">대화 글자 크기</label><select id="fs">${[[14, "작게"], [15.5, "보통"], [17, "크게"], [19, "아주 크게"]].map(([n, l]) => `<option value="${n}" ${S.settings.fs == n ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field" style="margin-top:0"><label for="th">테마</label><select id="th">${[["system", "시스템 따라가기"], ["dark", "다크"], ["light", "라이트"]].map(([k, l]) => `<option value="${k}" ${S.settings.theme === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="key">Anthropic API 키 (파일로 열었을 때만 필요)</label><input id="key" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(S.settings.apiKey)}"></div>
      <div class="two">
        <div class="field"><label for="gkey">Gemini API 키 (AI 이미지 생성 · 파일로 열었을 때)</label><input id="gkey" type="password" autocomplete="off" placeholder="AIza..." value="${esc(S.settings.geminiKey)}"></div>
        <div class="field"><label for="gmodel">이미지 모델</label><select id="gmodel">${[...IMG_MODELS, ...(IMG_MODELS.some((m) => m[0] === S.settings.imgModel) ? [] : [[S.settings.imgModel, S.settings.imgModel]])].map(([k, l]) => `<option value="${esc(k)}" ${S.settings.imgModel === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
      </div>
      <div class="cta-row" style="margin-top:6px"><button class="btn sm" id="gtest">이미지 생성 테스트</button><span class="note" id="gtestMsg">키는 Google AI Studio에서 받을 수 있어요. 이 브라우저에만 저장돼요.</span></div>
      <p class="note" style="margin-top:6px">현재 AI 연결: <b>${engineName()}</b>. claude.ai에서 열면 내 Claude 계정으로 대화해요. 키는 이 브라우저에만 저장돼요.</p>
      <p class="note">저장 위치: ${KV.dbOk ? "내 claude.ai 계정 (기기 간 동기화)" : "이 브라우저"} · 이미지: ${IMG.assets ? "아티팩트 저장소" : "압축 후 내 저장 공간"}</p>
      <div class="cta-row"><button class="btn sm pri" id="setSave">설정 저장</button><button class="btn sm danger" id="reset">모든 데이터 초기화</button></div>

  $("#nickSave").onclick = () => { S.profile.nick = $("#nick").value.trim(); KV.set("profile", S.profile); publishCommunity(); toast("저장했어요"); };
  $$("[data-def]", v).forEach((b) => b.onclick = () => { S.personas.forEach((p) => p.def = p.id === b.dataset.def); KV.set("personas", S.personas); viewMe(); });
  $$("[data-pedit]", v).forEach((b) => b.onclick = () => personaSheet(S.personas.find((p) => p.id === b.dataset.pedit), viewMe));
  const pa = $("#padd"); if (pa) pa.onclick = () => personaSheet(null, viewMe);
  $("#setSave").onclick = () => {
    S.settings.fs = +$("#fs").value; S.settings.theme = $("#th").value; S.settings.apiKey = $("#key").value.trim();

    saveSettings(); applySettings(); if (S.engine === "none" && S.settings.apiKey) S.engine = "byok"; toast("설정을 저장했어요"); viewMe();

      onUse: async () => toast("테스트 이미지는 저장하지 않아요. 키가 잘 작동해요!") });

    S.rooms.forEach((r) => KV.set(roomKey(r.id), undefined));
    ["rooms", "mine", "wallet", "personas", "profile", "imgpacks"].forEach((k) => KV.set(k, undefined));
    S.mine = []; publishCommunity();
    setTimeout(() => location.reload(), 600);
  });
}
function personaSheet(p, after) {
  let img = p?.img || "";
  const ov = sheet(`<div class="sheet-head"><h2>${p ? "페르소나 수정" : "새 페르소나"}</h2><button class="icon-btn" data-x aria-label="닫기">${ICON.close}</button></div>
    <div class="avatar-pick" style="margin:8px 0 4px"><div id="avBox">${pavHTML({ name: p?.name || "?", img })}</div><div><input type="file" id="av" accept="image/png,image/jpeg,image/webp" hidden><button class="btn sm" id="avBtn">이미지 올리기</button> <button class="btn sm" id="avAi">AI로 만들기</button> <button class="btn sm ghost" id="avDel" ${img ? "" : "hidden"}>빼기</button><p class="note" style="margin:6px 0 0">대화에서 내 말풍선 옆에 보여요.</p></div></div>
    <div class="field"><label for="pn">이름</label><input id="pn" maxlength="20" value="${esc(p?.name || "")}"></div>
    <div class="field"><label for="pm">메모 (목록에 보이는 한 줄, 예: 관능미 · 츤데레)</label><input id="pm" maxlength="30" value="${esc(p?.memo || "")}"></div>
    <div class="field"><label for="pd">상세 정보 (AI가 보고 나를 대해요)</label><textarea id="pd" maxlength="800" style="min-height:130px" placeholder="예: 27세 남자. 긴 장발의 리프컷, 진한 흑발. 나른하고 귀찮은 말투, 맑은 저음.">${esc(p?.desc || "")}</textarea></div>
    <div class="toggle" style="margin-top:12px"><label for="pdef">기본 페르소나로 쓰기</label><input type="checkbox" id="pdef" ${p?.def ? "checked" : ""}></div>
    <div class="cta-row">${p && S.personas.length > 1 ? `<button class="btn danger" id="pdel">삭제</button>` : ""}<span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="psave">저장</button></div>`);
  IMG.hydrate(ov);
  $("#avBtn", ov).onclick = () => $("#av", ov).click();
  $("#av", ov).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { img = await IMG.put(f); $("#avBox", ov).innerHTML = pavHTML({ name: $("#pn", ov).value || "?", img }); IMG.hydrate(ov); $("#avDel", ov).hidden = false; } catch { toast("이미지를 읽지 못했어요."); } };
  $("#avAi", ov).onclick = () => genImageSheet({ title: "AI로 페르소나 이미지 만들기", aspect: "1:1", refs: img ? [img] : [],
    prompt: `웹툰풍 프로필 일러스트, ${$("#pd", ov).value.trim() || $("#pn", ov).value.trim() || "인물"}, 정면 상반신, 정사각형 구도, 단순한 배경`,
    onUse: async (blob) => { img = await IMG.put(blob); $("#avBox", ov).innerHTML = pavHTML({ name: $("#pn", ov).value || "?", img }); IMG.hydrate(ov); $("#avDel", ov).hidden = false; } });
  $("#avDel", ov).onclick = () => { img = ""; $("#avBox", ov).innerHTML = pavHTML({ name: $("#pn", ov).value || "?", img: "" }); $("#avDel", ov).hidden = true; };
  $("#psave", ov).onclick = () => {
    const name = $("#pn", ov).value.trim(); if (!name) { $("#pn", ov).focus(); return; }
    const item = p || { id: uid("p") }; Object.assign(item, { name, memo: $("#pm", ov).value.trim(), desc: $("#pd", ov).value.trim(), img });
    if ($("#pdef", ov).checked) S.personas.forEach((x) => x.def = false);
    item.def = $("#pdef", ov).checked || (!!p && p.def);
    if (!p) S.personas.push(item);
    if (!S.personas.some((x) => x.def)) S.personas[0].def = true;
    KV.set("personas", S.personas);
    if (room && room.persona.id === item.id) { room.persona = { id: item.id, name: item.name, memo: item.memo, desc: item.desc, img: item.img }; saveRoom(room); renderLog(); }
    ov.remove(); after && after();
  };
  const del = $("#pdel", ov); if (del) del.onclick = () => { S.personas = S.personas.filter((x) => x !== p); if (!S.personas.some((x) => x.def)) S.personas[0].def = true; KV.set("personas", S.personas); ov.remove(); after && after(); };
}
function saveSettings() { try { localStorage.setItem("hv1_settings", JSON.stringify(S.settings)); } catch {} KV.set("memcfg", S.settings.memCfg); }
function applySettings() {
  document.documentElement.style.setProperty("--chat-fs", S.settings.fs + "px");
  if (S.settings.theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.settings.theme);
}

/* ---------------------------------------------------------------- 부팅 */
async function loadAll() {
  const [w, p, pr, mine, rooms, packs, mc] = await Promise.all(["wallet", "personas", "profile", "mine", "rooms", "imgpacks", "memcfg"].map((k) => KV.get(k)));
  if (w && typeof w === "object") S.wallet = { ...S.wallet, ...w, history: Array.isArray(w.history) ? w.history : [], ledger: Array.isArray(w.ledger) ? w.ledger : [], ack: w.ack && typeof w.ack === "object" ? w.ack : {} };
  else if (!S.wallet.welcomed) { S.wallet.hearts = WELCOME; S.wallet.welcomed = true; ledger(WELCOME, "첫 방문 보너스"); KV.set("wallet", S.wallet); }
  if (Array.isArray(p) && p.length) S.personas = p.map((x) => ({ memo: "", img: "", ...x }));
  if (pr && typeof pr === "object") S.profile = pr;
  if (Array.isArray(mine)) S.mine = mine.map(normalizeChar);
  if (Array.isArray(rooms)) S.rooms = rooms;
  if (packs && typeof packs === "object") S.imgpacks = packs;
  if (mc && typeof mc === "object") S.settings.memCfg = { ...S.settings.memCfg, ...mc };
  refreshFree();
}
async function boot() {
  try { const s = JSON.parse(localStorage.getItem("hv1_settings") || "null"); if (s) S.settings = { ...S.settings, ...s, memCfg: { ...S.settings.memCfg, ...(s.memCfg || {}) } }; } catch {}
  applySettings();
  await loadAll();
  renderShell(); route();
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($(".lightbox")) $(".lightbox").remove(); else if ($(".overlay")) closeOverlays(); else if (gen) stopGen();
  });

  const hasClaude = !!(window.claude && typeof window.claude.use === "function");
  samplePromise = (async () => {
    if (!hasClaude) { S.engine = S.settings.apiKey ? "byok" : "none"; return; }
    try { SAMPLE = await window.claude.use("sample"); } catch { SAMPLE = null; }
    if (SAMPLE) { S.engine = "sample"; try { const l = await SAMPLE.limits(); S.sampleTiers = Array.isArray(l?.modelTiers) ? l.modelTiers : null; } catch {} }
    else S.engine = S.settings.apiKey ? "byok" : "none";
  })().finally(() => { if ((location.hash.slice(1) || "home") === "home") viewHome(); });

  if (hasClaude) {
    window.claude.use("assets").then((a) => { IMG.assets = a || null; }).catch(() => {});
    window.claude.use("downloads").then((d) => { DOWNLOADS = d || null; }).catch(() => {});
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (db && user) {
        const id = await user.id();
        if (id) {
          DB = db; KV.db = db; KV.uid = id; KV.dbOk = true;
          const remoteRooms = await KV.get("rooms");
          if (remoteRooms === undefined || remoteRooms === null) {
            ["wallet", "personas", "profile", "mine", "rooms", "imgpacks", "memcfg"].forEach((k) => { const v = KV.getLocal(k); if (v !== undefined) KV.set(k, v); });
            S.rooms.forEach((r) => { const v = KV.getLocal(roomKey(r.id)); if (v) KV.set(roomKey(r.id), v); });
          } else { await loadAll(); renderRailRecent(); renderWalletChips(); if (!location.hash.startsWith("#r-")) route(); }
          watchCommunity();
        }
      }
    } catch {}
  }
}
boot();
</script>
