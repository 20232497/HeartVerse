<title>HEARTVERSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: 앱 셸 — 데스크톱은 왼쪽 레일 + 본문, 모바일은 하단 탭바. 대화방은 전체 높이 3단(헤더·로그·입력창). */
:root {
  --bg:#f6f4f9; --surface:#ffffff; --surface2:#efecf5; --line:#e2dcec; --fg:#1c1827; --muted:#6c6580;
  --narr:#5a536d; --accent:#e23d74; --accent-ink:#ffffff; --accent-soft:rgba(226,61,116,.10); --gold:#b9780f; --ok:#2b8a57; --err:#c92a3a;
  --scrim:rgba(20,16,30,.45);
  --display:"Hahmlet","Nanum Myeongjo",serif; --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --chat-fs:15.5px; --r:14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f0d15; --surface:#18151f; --surface2:#211d2b; --line:#2e2939; --fg:#eeeaf6; --muted:#9a93ae;
  --narr:#b4acc7; --accent:#ff5b8e; --accent-ink:#1a0b12; --accent-soft:rgba(255,91,142,.14); --gold:#f0b54a; --ok:#53c48a; --err:#ff6b7a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0f0d15; --surface:#18151f; --surface2:#211d2b; --line:#2e2939; --fg:#eeeaf6; --muted:#9a93ae;
  --narr:#b4acc7; --accent:#ff5b8e; --accent-ink:#1a0b12; --accent-soft:rgba(255,91,142,.14); --gold:#f0b54a; --ok:#53c48a; --err:#ff6b7a;
  --scrim:rgba(0,0,0,.6); color-scheme:dark; }

* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:14.5px; line-height:1.6; overflow:hidden; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
a { color:inherit; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ── 앱 셸 */
.app { display:grid; grid-template-columns:232px minmax(0,1fr); height:100%; }
.rail { border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; padding:18px 12px; gap:4px; overflow-y:auto; }
.logo { font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:.06em; padding:4px 10px 16px; display:flex; align-items:center; gap:8px; }
.logo i { font-style:normal; color:var(--accent); }
.nav { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:0; background:none; text-align:left; width:100%; color:var(--muted); font-weight:500; }
.nav:hover { background:var(--surface2); color:var(--fg); }
.nav.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav svg { width:19px; height:19px; flex:none; }
.rail h4 { margin:18px 12px 6px; font-size:11.5px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
.rail .recent { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:10px; border:0; background:none; width:100%; text-align:left; }
.rail .recent:hover { background:var(--surface2); }
.rail .recent .cover { width:30px; height:30px; border-radius:9px; flex:none; }
.rail .recent span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
.rail-foot { margin-top:auto; padding-top:14px; }
#view { height:100%; overflow-y:auto; overflow-x:hidden; position:relative; }
.tabbar { display:none; }
@media (max-width:899px) {
  .app { grid-template-columns:1fr; }
  .rail { display:none; }
  #view { height:calc(100% - 60px - env(safe-area-inset-bottom,0px)); }
  .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; height:calc(60px + env(safe-area-inset-bottom,0px)); padding:0 max(6px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px, env(safe-area-inset-left,0px)); background:var(--surface); border-top:1px solid var(--line); z-index:20; }
  .tabbar button { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--muted); }
  .tabbar button.on { color:var(--accent); font-weight:600; }
  .tabbar svg { width:21px; height:21px; }
  body.in-chat .tabbar { display:none; }
  body.in-chat #view { height:100%; }
}

.page { max-width:1120px; margin:0 auto; padding-block:20px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.topbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.topbar .logo { padding:0; display:none; }
@media (max-width:899px) { .topbar { flex-wrap:wrap; } .topbar .logo { display:flex; font-size:18px; } .topbar .search { order:9; flex-basis:100%; max-width:none; } }
.search { flex:1; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 14px; height:40px; }
.search input { border:0; background:none; outline:none; flex:1; min-width:0; }
.search svg { width:16px; height:16px; color:var(--muted); flex:none; }
.spacer { flex:1; }
.wallet { display:flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.wallet .h { color:var(--accent); }
.wallet .f { color:var(--muted); font-weight:500; }
.wallet.pro { border-color:var(--gold); }
.badge-pro { font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--gold); border:1px solid var(--gold); border-radius:5px; padding:0 5px; line-height:17px; }

h1.sec, h2.sec { font-family:var(--display); font-weight:700; font-size:19px; margin:30px 0 12px; display:flex; align-items:baseline; gap:10px; text-wrap:balance; }
h2.sec small { font-family:var(--sans); font-size:12.5px; color:var(--muted); font-weight:400; }
.chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); }
.chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
.note { color:var(--muted); font-size:12.5px; }
.empty { border:1px dashed var(--line); border-radius:var(--r); padding:22px; color:var(--muted); font-size:13.5px; text-align:center; }
.empty button { margin-top:10px; }

/* ── 버튼 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 16px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; white-space:nowrap; }
.btn:hover { border-color:var(--muted); }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.pri:hover { filter:brightness(1.07); }
.btn.gold { background:var(--gold); color:#1d1404; border-color:var(--gold); }
.btn.ghost { background:none; border-color:transparent; color:var(--muted); }
.btn.ghost:hover { color:var(--fg); background:var(--surface2); }
.btn.sm { height:32px; padding:0 11px; font-size:13px; border-radius:9px; }
.btn.block { width:100%; }
.btn.danger { color:var(--err); }
.btn:disabled { opacity:.45; cursor:not-allowed; filter:none; }
.icon-btn { width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; border:0; background:none; color:var(--muted); flex:none; }
.icon-btn:hover { background:var(--surface2); color:var(--fg); }
.icon-btn svg { width:20px; height:20px; }

/* ── 커버 아트 (캐릭터별 생성 일러스트) */
.cover { position:relative; overflow:hidden; isolation:isolate; color:#fff; container-type:inline-size;
  background:radial-gradient(110% 70% at 85% 5%, color-mix(in srgb, var(--c3) 55%, transparent), transparent 62%), linear-gradient(165deg, var(--c1) 10%, var(--c2) 120%); }
.cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.cover::before { content:""; position:absolute; inset:0; z-index:1; pointer-events:none; }
.cover::after { content:""; position:absolute; inset:0; z-index:2; background:linear-gradient(to top, rgba(8,6,12,.55), transparent 45%); pointer-events:none; }
.cover .glyph { position:absolute; right:-.08em; bottom:-.2em; font-family:var(--display); font-weight:800; font-size:82cqw; line-height:1; color:color-mix(in srgb, var(--c3) 38%, transparent); z-index:1; user-select:none; }
.cover .vt { position:absolute; left:9%; top:9%; writing-mode:vertical-rl; font-family:var(--display); font-weight:700; font-size:max(11px, 7.2cqw); letter-spacing:.14em; z-index:3; text-shadow:0 1px 8px rgba(0,0,0,.4); max-height:82%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.cover.has-img .glyph, .cover.has-img .vt { display:none; }
.m-rain::before { background:repeating-linear-gradient(103deg, rgba(255,255,255,.13) 0 1px, transparent 1px 11px); -webkit-mask:linear-gradient(to bottom, #000, transparent 85%); mask:linear-gradient(to bottom, #000, transparent 85%); }
.m-city::before { background:
  repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,226,170,.35) 7% 8%, transparent 8% 11%),
  linear-gradient(to top, rgba(0,0,0,.5), transparent);
  -webkit-mask:linear-gradient(to top, #000 0 38%, transparent 62%); mask:linear-gradient(to top, #000 0 38%, transparent 62%); }
.m-stars::before { background:
  radial-gradient(1.4px 1.4px at 12% 18%, #fff 50%, transparent), radial-gradient(1px 1px at 31% 42%, #fff 50%, transparent),
  radial-gradient(1.6px 1.6px at 58% 12%, #fff 50%, transparent), radial-gradient(1px 1px at 77% 33%, #fff 50%, transparent),
  radial-gradient(1.2px 1.2px at 88% 9%, #fff 50%, transparent), radial-gradient(1px 1px at 44% 26%, #fff 50%, transparent),
  radial-gradient(1.3px 1.3px at 20% 58%, #fff 50%, transparent), radial-gradient(1px 1px at 66% 52%, #fff 50%, transparent),
  radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.08), transparent); }
.m-glow::before { background:radial-gradient(circle at 28% 72%, color-mix(in srgb, var(--c3) 60%, transparent), transparent 42%), radial-gradient(circle at 28% 72%, rgba(255,255,255,.25), transparent 12%); }
.m-petals::before { background:
  radial-gradient(9px 5px at 18% 22%, color-mix(in srgb, var(--c3) 85%, transparent) 60%, transparent), radial-gradient(7px 4px at 72% 16%, color-mix(in srgb, var(--c3) 75%, transparent) 60%, transparent),
  radial-gradient(8px 5px at 40% 48%, color-mix(in srgb, var(--c3) 70%, transparent) 60%, transparent), radial-gradient(6px 4px at 84% 54%, color-mix(in srgb, var(--c3) 80%, transparent) 60%, transparent),
  radial-gradient(7px 4px at 26% 70%, color-mix(in srgb, var(--c3) 65%, transparent) 60%, transparent); }
.m-ash::before { background:radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.6px) 0 0/14px 14px, linear-gradient(to bottom, rgba(0,0,0,.25), transparent 50%); -webkit-mask:linear-gradient(to bottom, #000, transparent); mask:linear-gradient(to bottom, #000, transparent); }

/* ── 홈: 추천 캐러셀 */
.hero { display:grid; grid-auto-flow:column; grid-auto-columns:min(560px, 86%); gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:thin; }
.hero-card { scroll-snap-align:start; border-radius:18px; overflow:hidden; border:0; padding:0; text-align:left; display:grid; grid-template-columns:42% 1fr; background:var(--surface); min-height:230px; box-shadow:0 1px 0 var(--line); }
.hero-card .cover { height:100%; min-height:230px; }
.hero-card .body { padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
.hero-card .k { font-size:11.5px; color:var(--accent); font-weight:600; letter-spacing:.06em; }
.hero-card h3 { margin:0; font-family:var(--display); font-size:22px; line-height:1.25; text-wrap:balance; }
.hero-card p { margin:0; color:var(--muted); font-size:13.5px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.hero-card .who { margin-top:auto; font-size:13px; font-weight:600; }
@media (max-width:520px) { .hero-card { grid-template-columns:1fr; } .hero-card .cover { min-height:170px; } }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:16px 14px; }
@media (max-width:420px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px 10px; } }
.card { border:0; padding:0; background:none; text-align:left; display:flex; flex-direction:column; gap:7px; min-width:0; }
.card .cover { aspect-ratio:3/4; border-radius:14px; width:100%; max-width:100%; transition:transform .2s; }
.card:hover .cover { transform:translateY(-3px); }
.card .t { font-weight:700; font-size:14.5px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .d { color:var(--muted); font-size:12.5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.9em; }
.card .meta { display:flex; gap:6px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
.tag { font-size:11.5px; color:var(--muted); }
.cat { position:absolute; top:8px; right:8px; z-index:3; font-size:10.5px; font-weight:600; background:rgba(0,0,0,.42); backdrop-filter:blur(6px); padding:2px 8px; border-radius:999px; color:#fff; }

.cont { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px; }
.cont button { display:flex; gap:12px; align-items:center; text-align:left; padding:10px; border-radius:14px; border:1px solid var(--line); background:var(--surface); min-width:0; }
.cont .cover, .thumb { width:52px; height:52px; border-radius:12px; flex:none; }
.cont .x { min-width:0; flex:1; }
.cont .x b { display:block; font-size:14px; }
.cont .x span { display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── 캐릭터 상세 */
.detail { display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:28px; align-items:start; }
@media (max-width:780px) { .detail { grid-template-columns:1fr; gap:18px; } }
.detail .cover { aspect-ratio:3/4; border-radius:20px; width:100%; max-width:100%; }
@media (max-width:780px) { .detail .cover { aspect-ratio:4/3; } }
.detail h1 { font-family:var(--display); font-size:30px; line-height:1.2; margin:4px 0 6px; text-wrap:balance; }
.detail .lead { font-size:15.5px; margin:0 0 12px; }
.detail .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.detail .tags span { font-size:12.5px; background:var(--surface2); border-radius:7px; padding:2px 9px; color:var(--muted); }
.box { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }
.box + .box { margin-top:12px; }
.box h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
.box p { margin:0; white-space:pre-wrap; }
.openings { display:grid; gap:8px; }
.opening { display:block; border:1px solid var(--line); border-radius:12px; padding:11px 13px; cursor:pointer; background:var(--bg); }
.opening:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
.opening input { accent-color:var(--accent); margin-right:6px; }
.opening b { font-size:14px; }
.opening span { display:block; color:var(--muted); font-size:12.5px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cta-row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.cta-row .btn.pri { flex:1; min-width:180px; height:48px; font-size:15px; }
.field { display:grid; gap:5px; margin-top:12px; }
.field label, .lbl { font-size:12.5px; color:var(--muted); font-weight:600; }
.field input, .field textarea, .field select, .inp { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); outline:none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent); }
.field textarea { resize:vertical; min-height:84px; line-height:1.55; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
@media (max-width:560px) { .two { grid-template-columns:1fr; } }

/* ── 대화방 */
.chat { display:flex; flex-direction:column; height:100%; position:relative; }
.chat-bg { position:absolute; inset:0; z-index:0; opacity:.16; filter:blur(28px) saturate(1.2); pointer-events:none; overflow:hidden; }
.chat-bg .cover { position:absolute; inset:0; }
.chat-head { position:relative; z-index:2; display:flex; align-items:center; gap:10px; padding:10px max(12px, env(safe-area-inset-right,0px)) 10px max(8px, env(safe-area-inset-left,0px)); padding-top:calc(10px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(12px); }
.chat-head .cover { width:38px; height:38px; border-radius:11px; flex:none; }
.chat-head .who { min-width:0; flex:1; }
.chat-head .who b { display:block; font-size:15px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-head .who span { display:block; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meter { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.meter i { width:64px; height:6px; border-radius:3px; background:var(--surface2); overflow:hidden; display:block; }
.meter i b { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .6s; }
@media (max-width:480px) { .meter i { width:40px; } }
.chat-log { position:relative; z-index:1; flex:1; overflow-y:auto; overflow-x:hidden; padding-block:18px 12px; padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:max(14px, env(safe-area-inset-right,0px)); scroll-behavior:smooth; }
.log-inner { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
.scene-card { text-align:center; padding:6px 0 4px; }
.scene-card .cover { width:84px; height:84px; border-radius:22px; margin:0 auto 10px; }
.scene-card b { font-family:var(--display); font-size:19px; display:block; }
.scene-card span { color:var(--muted); font-size:12.5px; }
.msg { display:flex; gap:10px; align-items:flex-start; min-width:0; }
.msg .cover { width:36px; height:36px; border-radius:11px; flex:none; margin-top:2px; }
.msg .col { min-width:0; flex:1; display:flex; flex-direction:column; gap:6px; }
.msg .nm { font-size:12.5px; font-weight:600; color:var(--muted); }
.bubble { background:var(--surface); border:1px solid var(--line); border-radius:4px 16px 16px 16px; padding:13px 16px; font-size:var(--chat-fs); line-height:1.8; min-width:0; overflow-wrap:anywhere; word-break:keep-all; }
.bubble p { margin:0 0 9px; } .bubble p:last-child { margin:0; }
.bubble .narr { font-family:var(--serif); color:var(--narr); }
.bubble .dlg { color:var(--fg); font-weight:500; }
.bubble.typing::after { content:"▍"; color:var(--accent); animation:blink 1s steps(1) infinite; }
.thinking { display:inline-flex; gap:4px; padding:4px 0; }
.thinking i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:bob 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay:.15s; } .thinking i:nth-child(3) { animation-delay:.3s; }
@keyframes bob { 0%,60%,100% { opacity:.3; transform:none; } 30% { opacity:1; transform:translateY(-3px); } }
@keyframes blink { 50% { opacity:0; } }
.msg.me { justify-content:flex-end; }
.msg.me .col { align-items:flex-end; flex:0 1 auto; max-width:82%; }
.msg.me .bubble { background:var(--accent-soft); border-color:transparent; border-radius:16px 4px 16px 16px; }
.msg.me.ooc .bubble { background:none; border:1px dashed var(--line); color:var(--muted); font-size:13px; padding:7px 12px; }
.sys-pill { align-self:center; font-size:12px; color:var(--muted); background:var(--surface2); border-radius:999px; padding:3px 12px; }

const KV = {
  db: null, uid: null, dbOk: false, queues: {},

  getLocal(k) { try { const v = localStorage.getItem(this.lkey(k)); return v ? JSON.parse(v) : undefined; } catch { return undefined; } },
  setLocal(k, v) { try { if (v === undefined) localStorage.removeItem(this.lkey(k)); else localStorage.setItem(this.lkey(k), JSON.stringify(v)); } catch {} },
  ref(k) { return this.db.doc("data/users/" + this.uid + "/" + k); },
  async get(k) {
    if (this.dbOk) {

    }
    return this.getLocal(k);
  },
  set(k, v) {
    this.setLocal(k, v);
    if (!this.dbOk) return;
    const q = this.queues[k] || (this.queues[k] = { busy: false, next: undefined, has: false });
    q.next = v; q.has = true;
    if (q.busy) return;
    const pump = async () => {
      q.busy = true;
      while (q.has) {
        const val = q.next; q.has = false;
        try { if (val === undefined) await this.ref(k).delete(); else await this.ref(k).set({ v: val, at: Date.now() }); }
        catch (e) { if (e instanceof TypeError || (e && (e.code === "permission_denied" || e.code === "invalid_argument"))) { this.dbOk = false; q.has = false; } }
      }
      q.busy = false;
    };

  }
};

function fmt(text) {
  return text.split(/\n+/).filter((l) => l.trim()).map((line) => {
    let html = "";
    const re = /(\*[^*]+\*)|("[^"]*"|“[^”]*”)/g; let m, last = 0;
    while ((m = re.exec(line))) {
      if (m.index > last) html += esc(line.slice(last, m.index));
      html += m[1] ? `<span class="narr">${esc(m[1].slice(1, -1))}</span>` : `<span class="dlg">${esc(m[2])}</span>`;
      last = re.lastIndex;
    }
    html += esc(line.slice(last));
    const allNarr = /^\s*\*[^*]+\*\s*$/.test(line);
    return `<p class="${allNarr ? "narr" : ""}">${html}</p>`;
  }).join("");
}
function statusHTML(c, s, prev, live) {
  if (!s || !Object.keys(s).length) return "";
  const rows = c.fields.filter((f) => s[f] !== undefined && s[f] !== "").map((f) => {
    let val = s[f];
    if (f === c.gauge && typeof val === "number") {
      const d = prev && typeof prev[f] === "number" ? val - prev[f] : 0;
      val = `<span class="bar"><i><b style="width:${clamp(val, 0, 100)}%"></b></i>${val}${d ? `<span class="dl ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" + d : "▼" + -d}</span>` : ""}</span>`;
    } else if (f === "속마음") val = `<span class="inner ${live ? "" : "open"}" tabindex="0" title="눌러서 속마음 보기">${esc(val)}</span>`;
    else val = esc(val);
    return `<dt>${esc(f)}</dt><dd>${val}</dd>`;
  });
  return rows.length ? `<dl class="status">${rows.join("")}</dl>` : "";
}

function restoreStatus() {

}

async function sendTurn(text, { cont = false } = {}) {
  if (gen) return false;
  const tier = room.set.tier;
  if (!canPay(tier)) { upsell(tier === "default" ? "tier" : "hearts"); return false; }
  room.lastErr = "";
  room.msgs.push(cont ? { id: uid("m"), role: "user", text: "(이어서)", sys: true } : { id: uid("m"), role: "user", text });
  await generate();
  return true;
}
async function regen(i) {
  if (gen) return;
  if (!canPay(room.set.tier)) return upsell(room.set.tier === "default" ? "tier" : "hearts");
  room.msgs = room.msgs.slice(0, i + 1);
  await generate(room.msgs[i]);
}
/* target 없으면 새 AI 메시지, 있으면 그 메시지에 새 버전(alt) 추가 */
async function generate(target) {
  const r = room, tier = r.set.tier;
  let msg = target, altIdx;
  if (!msg) {
    const prevAi = [...r.msgs].reverse().find((m) => m.role === "ai");
    const before = prevAi ? (prevAi.alts[prevAi.idx].status || prevAi.statusBefore) : r.status;
    msg = { id: uid("m"), role: "ai", idx: 0, alts: [{ text: "" }], statusBefore: before };
    r.msgs.push(msg); altIdx = 0;
  } else { msg.alts.push({ text: "" }); altIdx = msg.alts.length - 1; msg.idx = altIdx; }
  const msgIndex = r.msgs.indexOf(msg);
  const input = buildInput(r, msgIndex, msg.statusBefore);
  const paid = charge(tier);
  const ctl = new AbortController();
  gen = { ctl, msgId: msg.id };
  renderLog(true); updateSend();
  let full = "";
  const show = (t) => {
    full = t;
    let body = t.split(MARK)[0].replace(/\n?=+[A-Z]*=*\s*$/, "");
    msg.alts[altIdx].text = body.trim();
    const el = $("#liveBubble");
    if (el) { el.innerHTML = fmt(msg.alts[altIdx].text); const log = $("#log"); if (log && log.scrollHeight - log.scrollTop - log.clientHeight < 220) log.scrollTop = log.scrollHeight; }
    else if (room === r) renderLog(true);
  };
  try {
    const text = await llm(input, { tier, signal: ctl.signal, onText: ({ text }) => show(text) });
    show(text);
    const parsed = parseState(text, r.char, msg.statusBefore);
    Object.assign(msg.alts[altIdx], parsed, { text: msg.alts[altIdx].text || "(빈 응답)" });
    r.status = parsed.status;
    if (parsed.facts.length) r.facts.push(...parsed.facts);
  } catch (e) {
    const keep = e && e.text ? e.text.split(MARK)[0].trim() : "";
    if (keep && e.code === "cancelled") { msg.alts[altIdx].text = keep; msg.alts[altIdx].status = msg.statusBefore; }
    else {
      msg.alts.splice(altIdx, 1);
      if (!msg.alts.length) r.msgs.splice(r.msgs.indexOf(msg), 1); else msg.idx = msg.alts.length - 1;
      refund(paid);
      const copy = errCopy(e); if (copy) r.lastErr = copy;
    }
  } finally {
    gen = null;
    saveRoom(r);
    if (room === r && $("#logInner")) { renderLog(true); updateSend(); updateMeter(); }
    maybeConsolidate(r);
  }
}
function stopGen() { if (gen) gen.ctl.abort(); }
function parseState(text, c, before) {
  const i = text.indexOf(MARK);
  const out = { status: { ...(before || {}) }, suggestions: [], facts: [] };
  if (i < 0) return out;
  const v = looseJSON(text.slice(i + MARK.length));
  if (!v || typeof v !== "object") return out;
  if (v.status && typeof v.status === "object") {
    for (const f of c.fields) if (v.status[f] !== undefined) out.status[f] = typeof v.status[f] === "string" ? v.status[f].slice(0, 120) : v.status[f];
    const prev = typeof before?.[c.gauge] === "number" ? before[c.gauge] : 10;
    let g = Number(v.status[c.gauge]);
    out.status[c.gauge] = Number.isFinite(g) ? clamp(Math.round(clamp(g, prev - 10, prev + 8)), 0, 100) : prev;
  }
  if (Array.isArray(v.suggestions)) out.suggestions = v.suggestions.filter((s) => typeof s === "string").map((s) => s.slice(0, 60)).slice(0, 3);
  if (Array.isArray(v.facts)) out.facts = v.facts.filter((s) => typeof s === "string" && s.trim()).map((s) => s.slice(0, 80)).slice(0, 2);
  return out;
}

/* 장기 기억: 컨텍스트에서 밀려난 대화 + 새 사실을 노트로 압축 */
let consolidating = false;
async function maybeConsolidate(r, force = false) {
  if (consolidating) return;
  const L = lim(), visibleFrom = Math.max(0, r.msgs.length - L.ctx);
  const dropped = r.msgs.slice(r.memCursor || 0, visibleFrom).filter((m) => curText(m) && !m.sys);
  if (!force && r.facts.length < 6 && dropped.length < 8) return;
  if (!force && !dropped.length && !r.facts.length) return;
  consolidating = true; flagMemo(true);
  const excerpt = dropped.map((m) => (m.role === "ai" ? r.char.name : r.persona.name) + ": " + curText(m).replace(/\s+/g, " ").slice(0, 320)).join("\n");
  const prompt = `롤플레이 「${r.char.title}」의 장기 기억 노트를 갱신한다. 기존 노트, 새로 확정된 사실, 대화 발췌를 하나의 노트로 합쳐라.
- 인물 관계의 변화, 약속, 밝혀진 과거·비밀, 건넨 물건, 별명·말버릇, 중요한 사건, 미해결 떡밥을 우선 남긴다.
- 중복은 합치고 덜 중요한 것은 압축한다. 사건 순서가 드러나게 쓴다.
- '- '로 시작하는 줄 목록, 전체 ${L.memo}자 이내.
JSON {"memory":"..."} 하나로만 답하라.

[기존 노트]
${r.memory || "(없음)"}

[새 사실]
${r.facts.map((f) => "- " + f).join("\n") || "(없음)"}

[대화 발췌 — 컨텍스트에서 밀려난 부분]
${excerpt || "(없음)"}`;
  try {
    const v = await llm([{ role: "user", content: prompt }], { tier: "quick", json: true });
    if (v && typeof v.memory === "string" && v.memory.trim()) {
      r.memory = v.memory.trim().slice(0, L.memo); r.facts = []; r.memCursor = visibleFrom; saveRoom(r);
    }
  } catch {} finally { consolidating = false; flagMemo(false); }
}
function flagMemo(on) {
  document.querySelectorAll(".memo-flag").forEach((x) => x.remove());
  if (on && $(".chat")) { const f = document.createElement("div"); f.className = "memo-flag"; f.textContent = "기억을 정리하는 중…"; $(".chat").append(f); }
}

async function aiDraft(id) {
  const concept = $("#concept").value.trim(), m = $("#aiMsg"), b = $("#aiGen");
  if (!concept) { m.className = "msgline err"; m.textContent = "컨셉을 한 줄 적어 주세요."; return; }
  collect(); b.disabled = true; m.className = "msgline"; m.textContent = "캐릭터를 설계하는 중… (보통 20~60초)";
  const prompt = `한국어 캐릭터 롤플레이 플랫폼에 올릴 오리지널 캐릭터를 설계하라. 컨셉: ${concept}
조건: 모든 인물은 성인(20세 이상). 실존 인물·기존 작품 캐릭터를 쓰지 않는다. 유저가 바로 몰입할 수 있는 구체적 갈등과 떡밥을 넣는다.
JSON 하나로만 답하라:
{"name":"캐릭터 이름","title":"작품명(12자 이내)","oneLiner":"카드용 한 줄 소개(45자 이내, 유저를 2인칭 '당신'으로)","cat":"${CATS.join("|")} 중 하나","tags":["태그 4개"],"glyph":"작품을 상징하는 한자 한 글자","pal":0~7 정수(0 밤비 남색,1 장미,2 별밤,3 새벽 청록,4 단풍,5 잿빛,6 네온 보라,7 숲),"motif":"rain|city|stars|glow|petals|ash","desc":"상세 소개 2~3문장","persona":"이름(나이, 성별). 직업·신분. 성격(장점과 결점). 버릇. 외모. 유저와의 관계 — 5~7문장","world":"세계관·장소·주변 인물·규칙 3~5문장","speech":"말투 설명 한 줄 + 대표 대사 2개(각 줄에 큰따옴표)","secret":"숨겨진 설정 한 문장","fields":["상태창 항목 3~5개, 관계 게이지 항목과 '속마음' 포함"],"gauge":"관계 게이지 항목 이름","openings":[{"title":"상황 제목","text":"첫 메시지 300~500자. *서술* 과 \\"대사\\" 를 줄바꿈으로 섞고, 유저가 반응할 여지를 남기며 끝낸다. 유저의 행동은 쓰지 않는다."},{"title":"다른 상황","text":"..."}]}`;
  try {
    const v = await llm([{ role: "user", content: prompt }], { tier: "default", json: true });
    if (!v || typeof v !== "object" || !v.name) throw { code: "invalid_json" };
    const d = draft, s = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
    Object.assign(d, {
      name: s(v.name, 16), title: s(v.title, 24), oneLiner: s(v.oneLiner, 70), cat: CATS.includes(v.cat) ? v.cat : d.cat,
      tags: Array.isArray(v.tags) ? v.tags.map((t) => s(t, 12).replace(/^#/, "")).filter(Boolean).slice(0, 5) : d.tags,
      glyph: s(v.glyph, 1), pal: Number.isInteger(v.pal) && PALETTES[v.pal] ? v.pal : d.pal, motif: MOTIFS[v.motif] ? v.motif : d.motif,
      desc: s(v.desc, 400), persona: s(v.persona, 1500), world: s(v.world, 1200), speech: s(v.speech, 600), secret: s(v.secret, 200),
      fields: Array.isArray(v.fields) && v.fields.length ? v.fields.map((f) => s(f, 10)).filter(Boolean).slice(0, 6) : d.fields,
      gauge: s(v.gauge, 10) || d.gauge,
      openings: Array.isArray(v.openings) && v.openings.length ? v.openings.slice(0, 3).map((o) => ({ title: s(o.title, 20), text: s(o.text, 1500), status: {} })) : d.openings
    });
    viewStudio(id); const mm = $("#aiMsg"); mm.className = "msgline ok"; mm.textContent = "초안을 채웠어요. 마음에 들게 고친 뒤 만들기를 누르세요.";
  } catch (e) {
    b.disabled = false; m.className = "msgline err"; m.textContent = e.code === "invalid_json" ? "초안 형식이 깨졌어요. 한 번 더 눌러 주세요." : errCopy(e) || "취소했어요.";
  }
}
function downscale(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL("image/jpeg", 0.82)); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* 커뮤니티: pub/<내 id> 문서 하나에 내 공개 캐릭터를 모아 둔다 (모두 읽기, 본인만 쓰기) */
async function publishCommunity() {
  if (!DB || !KV.uid) return;
  const pubs = S.mine.filter((m) => m.publish).map((m) => ({ ...m, creator: S.profile.nick || "익명 크리에이터" }));
  try { if (pubs.length) await DB.doc("pub/" + KV.uid).set({ chars: pubs, at: Date.now() }); else await DB.doc("pub/" + KV.uid).delete(); }
  catch { if (pubs.length) toast("커뮤니티 공개는 이 페이지에 참여 권한이 있는 사람만 할 수 있어요. 캐릭터는 내 보관함에 저장됐어요."); }
}
function cleanChar(c) {
  if (!c || typeof c !== "object") return null;
  const s = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
  if (!s(c.id, 40).match(/^u[a-z0-9]+$/) || !c.name || !Array.isArray(c.openings) || !c.openings.length) return null;
  const fields = Array.isArray(c.fields) ? c.fields.map((f) => s(f, 10)).filter(Boolean).slice(0, 6) : ["호감도"];
  const gauge = s(c.gauge, 10) || fields[0];
  return { id: c.id, name: s(c.name, 16), title: s(c.title, 24), oneLiner: s(c.oneLiner, 70), cat: CATS.includes(c.cat) ? c.cat : "일상",
    tags: Array.isArray(c.tags) ? c.tags.map((t) => s(t, 12)).slice(0, 5) : [], glyph: s(c.glyph, 1), pal: PALETTES[c.pal] ? c.pal : 0, motif: MOTIFS[c.motif] ? c.motif : "glow",
    img: safeImg(c.img), desc: s(c.desc, 400), persona: s(c.persona, 1500), world: s(c.world, 1200), speech: s(c.speech, 600), secret: s(c.secret, 200),
    fields: fields.includes(gauge) ? fields : [gauge, ...fields], gauge, creator: s(c.creator, 20) || "익명 크리에이터",
    openings: c.openings.slice(0, 3).map((o) => ({ title: s(o?.title, 20), text: s(o?.text, 1500), status: (o && typeof o.status === "object" && o.status) ? o.status : {} })).filter((o) => o.text) };
}
function watchCommunity() {
  if (!DB) return;
  DB.collection("pub").limit(200).onSnapshot((snap) => {
    const list = [];
    snap.docs.forEach((doc) => { const arr = doc.data()?.chars; if (Array.isArray(arr)) arr.slice(0, 20).forEach((c) => { const cc = cleanChar(c); if (cc && cc.openings.length) list.push({ ...cc, ownerDoc: doc.id }); }); });
    S.community = list;
    const h = location.hash.slice(1) || "home"; if (h === "home") viewHome(); else if (h.startsWith("c-") && !$("#view .detail")) route();
  }, () => {});
}

      <label><input type="radio" name="pm" checked> 신용·체크카드</label>
      <label><input type="radio" name="pm"> 간편결제</label>
      <label><input type="radio" name="pm"> 휴대폰 결제</label>
    </div>
    <p class="demo-note">데모 결제예요. 결제 정보를 받지 않고, 실제로 청구되지 않아요.</p>
    <div class="cta-row"><button class="btn ghost" data-x>취소</button><button class="btn pri" id="pay">${won(item.price)} 결제하기</button></div>
  </div>`;
  document.body.append(ov);
  ov.onclick = (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); };
  $("#pay", ov).onclick = () => {
    const b = $("#pay", ov); b.disabled = true; b.textContent = "결제 승인 중…";
    setTimeout(() => {
      if (item.id === "plus") { const base = isPro() ? S.wallet.pro.until : Date.now(); S.wallet.pro = { until: base + 30 * 86400000 }; }
      else S.wallet.hearts += item.hearts;
      S.wallet.history.unshift({ at: Date.now(), name: item.name, price: item.price }); S.wallet.history = S.wallet.history.slice(0, 50);
      saveWallet();
      $(".sheet", ov).innerHTML = `<div class="ok-mark">♥</div><h2 style="text-align:center">결제 완료</h2>
        <p class="sub" style="text-align:center">${item.id === "plus" ? "HEARTVERSE+가 시작됐어요. 이제 기본 대화가 무제한이에요." : "하트 " + item.hearts.toLocaleString() + "개가 지급됐어요."}</p>
        <button class="btn pri block" data-x>${after ? "대화로 돌아가기" : "확인"}</button>`;
      $("[data-x]", ov).onclick = () => { ov.remove(); if (after) after(); else route(); };
    }, 1100);
  };
}
function upsell(reason) {
  closeOverlays();
  const copy = {
    hearts: ["오늘 무료 대화를 다 썼어요", `무료 대화는 매일 자정에 ${FREE_DAILY}회로 채워져요. 지금 이어 가려면 하트를 쓰거나 PLUS로 무제한 대화하세요.`],
    tier: ["몰입 모델은 하트가 필요해요", `몰입 모델은 한 번에 ♥${COST.default.free}이에요. PLUS 멤버는 ♥${COST.default.pro}로 써요.`],
    long: ["'길게'는 PLUS 전용이에요", "소설 분량의 긴 응답과 두 배 넘는 장기 기억을 PLUS에서 쓸 수 있어요."],
    rooms: ["대화방을 더 만들 수 없어요", `무료 요금제는 캐릭터당 대화방 ${LIMITS.free.rooms}개까지예요. 기존 대화방을 지우거나 PLUS로 무제한 만들 수 있어요.`]
  }[reason];
  const ov = document.createElement("div"); ov.className = "overlay";
  const small = PACKS[1];
  ov.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(copy[0])}"><h2>${esc(copy[0])}</h2><p class="sub">${esc(copy[1])}</p>
    <div class="member" style="padding:16px"><div class="row"><b style="font-family:var(--display);font-size:18px">HEARTVERSE<em style="font-style:normal;color:#f0b54a">+</em></b><span class="spacer"></span><span>${won(PLUS.price)}/월</span></div>
      <p style="margin:6px 0 12px;color:#e9dfcf;font-size:13px">기본 대화 무제한 · 몰입 ♥1 · 장기 기억 2배 · 긴 응답</p><button class="btn gold block" id="upPlus">PLUS 시작하기</button></div>
    ${reason !== "long" && reason !== "rooms" ? `<button class="btn block" id="upPack" style="margin-top:10px">♥ ${(small.n + small.bonus).toLocaleString()} 충전 · ${won(small.price)}</button>` : ""}
    ${reason === "tier" ? `<button class="btn ghost block" id="upBasic" style="margin-top:6px">기본 모델로 계속하기</button>` : ""}
    <button class="btn ghost block" data-x style="margin-top:6px">닫기</button></div>`;
  document.body.append(ov);
  const back = () => { if (room && $("#logInner")) { renderLog(); updateSend(); } };
  ov.onclick = (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); };
  $("#upPlus", ov).onclick = () => checkout(PLUS, back);
  const pk = $("#upPack", ov); if (pk) pk.onclick = () => checkout({ id: small.id, name: "하트 " + (small.n + small.bonus) + "개", price: small.price, hearts: small.n + small.bonus }, back);
  const ub = $("#upBasic", ov); if (ub) ub.onclick = () => { ov.remove(); room.set.tier = "quick"; saveRoom(room); document.querySelectorAll("[data-tier]").forEach((x) => x.classList.toggle("on", x.dataset.tier === "quick")); updateSend(); };
}
function confirmSheet(title, sub, okLabel, onOk) {
  closeOverlays();
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <div class="cta-row"><button class="btn ghost" data-x>취소</button><button class="btn pri" id="ok">${esc(okLabel)}</button></div></div>`;
  document.body.append(ov);
  ov.onclick = (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); };
  $("#ok", ov).onclick = () => { ov.remove(); onOk(); };
}
function closeOverlays() { document.querySelectorAll(".overlay").forEach((o) => o.remove()); }

/* ---------------------------------------------------------------- MY */
function viewMe() {
  const v = $("#view");
  const turns = S.rooms.length;
  v.innerHTML = `<div class="page">${topbar()}
    <h1 class="sec" style="margin-top:4px">MY</h1>
    <div class="statline">
      <div class="box"><h3>대화방</h3><b>${turns}</b></div>
      <div class="box"><h3>만든 캐릭터</h3><b>${S.mine.length}</b></div>
      <div class="box"><h3>멤버십</h3><b>${isPro() ? "PLUS" : "무료"}</b></div>
    </div>
    <h2 class="sec">크리에이터 프로필</h2>
    <div class="box"><div class="field" style="margin:0"><label for="nick">크리에이터 이름 (커뮤니티 공개 캐릭터에 표시)</label><input id="nick" maxlength="20" value="${esc(S.profile.nick)}" placeholder="예: 새벽작가"></div>
      <button class="btn sm" id="nickSave" style="margin-top:10px">저장</button></div>
    <h2 class="sec">내 페르소나 <small>대화할 때 내가 연기하는 캐릭터</small></h2>
    <div class="box"><div id="plist">${S.personas.map((p) => `<div class="persona"><div class="av">${esc(p.name.slice(0, 1))}</div><div class="x"><b>${esc(p.name)} ${p.def ? `<span class="badge-pro" style="color:var(--accent);border-color:var(--accent)">기본</span>` : ""}</b><span>${esc(p.desc || "설명 없음")}</span></div>
      <button class="btn sm ghost" data-pedit="${esc(p.id)}">수정</button></div>`).join("")}</div>
      ${S.personas.length < 5 ? `<button class="btn sm" id="padd" style="margin-top:8px">+ 페르소나 추가</button>` : ""}</div>
    <h2 class="sec">설정</h2>
    <div class="box">
      <div class="two">
        <div class="field" style="margin-top:0"><label for="fs">대화 글자 크기</label><select id="fs">${[[14, "작게"], [15.5, "보통"], [17, "크게"], [19, "아주 크게"]].map(([n, l]) => `<option value="${n}" ${S.settings.fs == n ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field" style="margin-top:0"><label for="th">테마</label><select id="th">${[["system", "시스템 따라가기"], ["dark", "다크"], ["light", "라이트"]].map(([k, l]) => `<option value="${k}" ${S.settings.theme === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="key">Anthropic API 키 (파일로 열었을 때만 필요)</label><input id="key" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(S.settings.apiKey)}"></div>
      <p class="note" style="margin-top:6px">현재 AI 연결: <b>${engineName()}</b>. claude.ai에서 열면 내 Claude 계정으로 대화해요. 키는 이 브라우저에만 저장돼요.</p>
      <p class="note">저장 위치: ${KV.dbOk ? "내 claude.ai 계정 (기기 간 동기화)" : "이 브라우저"}</p>
      <div class="cta-row"><button class="btn sm pri" id="setSave">설정 저장</button><button class="btn sm danger" id="reset">모든 데이터 초기화</button></div>
    </div>
  </div>`;
  bindGo(v);
  $("#nickSave").onclick = () => { S.profile.nick = $("#nick").value.trim(); KV.set("profile", S.profile); publishCommunity(); toast("저장했어요"); };
  v.querySelectorAll("[data-pedit]").forEach((b) => b.onclick = () => personaSheet(S.personas.find((p) => p.id === b.dataset.pedit)));
  const pa = $("#padd"); if (pa) pa.onclick = () => personaSheet(null);
  $("#setSave").onclick = () => {
    S.settings.fs = +$("#fs").value; S.settings.theme = $("#th").value; S.settings.apiKey = $("#key").value.trim();
    try { localStorage.setItem("hv1_settings", JSON.stringify(S.settings)); } catch {}
    applySettings(); if (S.engine === "none" && S.settings.apiKey) S.engine = "byok"; toast("설정을 저장했어요"); viewMe();
  };
  $("#reset").onclick = () => confirmSheet("모든 데이터를 지울까요?", "대화방, 만든 캐릭터, 하트, 페르소나가 모두 지워져요. 되돌릴 수 없어요.", "전부 삭제", () => {
    S.rooms.forEach((r) => KV.set(roomKey(r.id), undefined));
    ["rooms", "mine", "wallet", "personas", "profile"].forEach((k) => KV.set(k, undefined));
    S.mine = []; publishCommunity();
    setTimeout(() => location.reload(), 600);
  });
}
function personaSheet(p) {
  closeOverlays();
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-label="페르소나"><h2>${p ? "페르소나 수정" : "새 페르소나"}</h2><p class="sub">AI는 이 설명을 보고 나를 대해요. 외모·성격·직업을 적어 두면 몰입감이 커져요.</p>
    <div class="field"><label for="pn">이름</label><input id="pn" maxlength="20" value="${esc(p?.name || "")}"></div>
    <div class="field"><label for="pd">설명</label><textarea id="pd" maxlength="400" placeholder="예: 27세, 출판사 편집자. 말수가 적고 관찰력이 좋다. 비 오는 날을 좋아한다.">${esc(p?.desc || "")}</textarea></div>
    <div class="toggle"><label for="pdef">기본 페르소나로 쓰기</label><input type="checkbox" id="pdef" ${p?.def ? "checked" : ""}></div>
    <div class="cta-row">${p && S.personas.length > 1 ? `<button class="btn danger" id="pdel">삭제</button>` : ""}<span class="spacer"></span><button class="btn ghost" data-x>취소</button><button class="btn pri" id="psave">저장</button></div></div>`;
  document.body.append(ov);
  ov.onclick = (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); };
  $("#psave", ov).onclick = () => {
    const name = $("#pn", ov).value.trim(); if (!name) { $("#pn", ov).focus(); return; }
    const item = p || { id: uid("p") }; item.name = name; item.desc = $("#pd", ov).value.trim();
    if ($("#pdef", ov).checked) S.personas.forEach((x) => x.def = false);
    item.def = $("#pdef", ov).checked;
    if (!p) S.personas.push(item);
    if (!S.personas.some((x) => x.def)) S.personas[0].def = true;
    KV.set("personas", S.personas); ov.remove(); viewMe();
  };
  const del = $("#pdel", ov); if (del) del.onclick = () => { S.personas = S.personas.filter((x) => x !== p); if (!S.personas.some((x) => x.def)) S.personas[0].def = true; KV.set("personas", S.personas); ov.remove(); viewMe(); };
}
function applySettings() {
  document.documentElement.style.setProperty("--chat-fs", S.settings.fs + "px");
  if (S.settings.theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.settings.theme);
}

/* ---------------------------------------------------------------- 부팅 */
async function loadAll() {
  const [w, p, pr, mine, rooms] = await Promise.all(["wallet", "personas", "profile", "mine", "rooms"].map((k) => KV.get(k)));
  if (w && typeof w === "object") S.wallet = { ...S.wallet, ...w, history: Array.isArray(w.history) ? w.history : [] };
  if (Array.isArray(p) && p.length) S.personas = p;
  if (pr && typeof pr === "object") S.profile = pr;
  if (Array.isArray(mine)) S.mine = mine;
  if (Array.isArray(rooms)) S.rooms = rooms;
  refreshFree();
}
async function boot() {
  try { const s = JSON.parse(localStorage.getItem("hv1_settings") || "null"); if (s) S.settings = { ...S.settings, ...s }; } catch {}
  applySettings();
  await loadAll();
  renderShell(); route();
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (document.querySelector(".overlay")) closeOverlays(); else if (gen) stopGen(); } });

  const hasClaude = !!(window.claude && typeof window.claude.use === "function");
  samplePromise = (async () => {
    if (!hasClaude) { S.engine = S.settings.apiKey ? "byok" : "none"; return; }
    try { SAMPLE = await window.claude.use("sample"); } catch { SAMPLE = null; }
    if (SAMPLE) { S.engine = "sample"; try { const l = await SAMPLE.limits(); S.sampleTiers = Array.isArray(l?.modelTiers) ? l.modelTiers : null; } catch {} }
    else S.engine = S.settings.apiKey ? "byok" : "none";
  })().finally(() => { const n = $("#engineNote"); if (n) n.textContent = ""; if ((location.hash.slice(1) || "home") === "home") viewHome(); });

  if (hasClaude) {
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (db && user) {
        const id = await user.id();
        if (id) {
          DB = db; KV.db = db; KV.uid = id; KV.dbOk = true;
          const remoteRooms = await KV.get("rooms");
          if (remoteRooms === undefined || remoteRooms === null) {
            // 처음 연결: 이 브라우저에 있던 데이터를 계정으로 올린다
            ["wallet", "personas", "profile", "mine", "rooms"].forEach((k) => { const v = KV.getLocal(k); if (v !== undefined) KV.set(k, v); });
            S.rooms.forEach((r) => { const v = KV.getLocal(roomKey(r.id)); if (v) KV.set(roomKey(r.id), v); });
          } else { await loadAll(); renderRailRecent(); renderWalletChips(); if (!location.hash.startsWith("#r-")) route(); }
          watchCommunity();
        }
      }
    } catch {}
  }
}
boot();
</script>
